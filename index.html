<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MyKitchen</title><meta name="theme-color" content="#244b39"><meta name="description" content="Il tuo ricettario personale, anche offline"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon-192.png"><style>:root{font-family:system-ui,-apple-system,sans-serif;color:#263328;background:#f8f7f2}*{box-sizing:border-box}body{margin:0}header{background:#244b39;color:white;padding:30px 20px}header div,main{max-width:900px;margin:auto}h1{margin:0;font-size:2rem}header p{opacity:.85;margin-bottom:0}main{padding:22px 16px}.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}input,select,textarea,button{font:inherit;border-radius:10px;padding:11px;border:1px solid #c9d0c9}input,textarea{width:100%}.tools input{flex:2;min-width:180px}.tools select{flex:1;min-width:140px}button{cursor:pointer;background:#244b39;color:white;border:0}button.secondary{background:#e5eae5;color:#244b39}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:15px}.recipe{background:white;padding:20px;border-radius:16px;box-shadow:0 2px 12px #233b2712}.recipe h3{margin:8px 0}.recipe small{color:#657469}.recipe p{white-space:pre-wrap;overflow-wrap:anywhere}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{font-size:.88rem;padding:8px}dialog{border:0;border-radius:18px;padding:25px;width:min(95vw,520px);max-height:90vh;overflow:auto}dialog::backdrop{background:#14241a99}label{display:block;margin:12px 0 5px;font-weight:600}textarea{min-height:90px;resize:vertical}.dialog-actions{display:flex;gap:10px;margin-top:20px}.muted{color:#647369}.empty{text-align:center;padding:40px}.heart{color:#ad3e4e}#message{min-height:24px}</style></head><body><header><div><h1>🍃 MyKitchen</h1><p>Le tue ricette, tutte in un posto.</p></div></header><main><div class="tools"><input id="search" placeholder="Cerca per nome o ingrediente…" aria-label="Cerca ricette"><select id="categoryFilter" aria-label="Filtra categoria"><option value="">Tutte le categorie</option></select><button id="favoritesFilter" class="secondary" aria-pressed="false">♡ Preferite</button><button id="add">+ Nuova ricetta</button></div><p id="count" class="muted"></p><div id="recipes" class="grid"></div><p id="message" role="status"></p></main><dialog id="editor"><form id="recipeForm"><h2 id="formTitle">Nuova ricetta</h2><input type="hidden" id="recipeId"><label for="name">Nome della ricetta</label><input id="name" required maxlength="100"><label for="category">Categoria</label><select id="category"><option>Primi</option><option>Secondi</option><option>Contorni</option><option>Dolci</option><option>Antipasti</option><option>Altro</option></select><label for="ingredients">Ingredienti (uno per riga)</label><textarea id="ingredients" required></textarea><label for="instructions">Procedimento</label><textarea id="instructions" required></textarea><div class="dialog-actions"><button type="submit">Salva ricetta</button><button type="button" id="cancel" class="secondary">Annulla</button></div></form></dialog><script>
const KEY='mykitchen.recipes.v1';const categories=['Primi','Secondi','Contorni','Dolci','Antipasti','Altro'];let recipes=[];let onlyFavorites=false;const $=id=>document.getElementById(id);function load(){try{const data=JSON.parse(localStorage.getItem(KEY)||'[]');recipes=Array.isArray(data)?data:[]}catch{recipes=[];$('message').textContent='Impossibile leggere le ricette salvate.'}}function save(){try{localStorage.setItem(KEY,JSON.stringify(recipes));$('message').textContent='Ricette salvate su questo dispositivo.';return true}catch{$('message').textContent='Salvataggio non riuscito: verifica lo spazio o le impostazioni del browser.';return false}}function render(){const filter=$('search').value.trim().toLocaleLowerCase('it');const cat=$('categoryFilter').value;const found=recipes.filter(r=>(!cat||r.category===cat)&&(!onlyFavorites||r.favorite)&&(`${r.name} ${r.ingredients}`.toLocaleLowerCase('it').includes(filter)));$('count').textContent=`${found.length} ${found.length===1?'ricetta':'ricette'}`;$('recipes').replaceChildren();if(!found.length){const empty=document.createElement('p');empty.className='empty muted';empty.textContent=recipes.length?'Nessuna ricetta corrisponde alla ricerca.':'Il tuo ricettario è vuoto. Aggiungi la prima ricetta!';$('recipes').append(empty)}for(const r of found){const card=document.createElement('article');card.className='recipe';const label=document.createElement('small');label.textContent=r.category;const title=document.createElement('h3');title.textContent=r.name;const ing=document.createElement('p');ing.textContent='Ingredienti: '+r.ingredients;const procedure=document.createElement('p');procedure.textContent=r.instructions;const actions=document.createElement('div');actions.className='actions';const favorite=document.createElement('button');favorite.className='secondary';favorite.textContent=r.favorite?'♥ Preferita':'♡ Preferita';favorite.onclick=()=>{r.favorite=!r.favorite;save();render()};const edit=document.createElement('button');edit.className='secondary';edit.textContent='Modifica';edit.onclick=()=>openEditor(r);const remove=document.createElement('button');remove.className='secondary';remove.textContent='Elimina';remove.onclick=()=>{if(confirm(`Eliminare “${r.name}”?`)){recipes=recipes.filter(x=>x.id!==r.id);save();render()}};actions.append(favorite,edit,remove);card.append(label,title,ing,procedure,actions);$('recipes').append(card)}}function openEditor(r){$('recipeForm').reset();$('recipeId').value=r?.id||'';$('formTitle').textContent=r?'Modifica ricetta':'Nuova ricetta';if(r){$('name').value=r.name;$('category').value=r.category;$('ingredients').value=r.ingredients;$('instructions').value=r.instructions}$('editor').showModal()}$('recipeForm').onsubmit=e=>{e.preventDefault();const id=$('recipeId').value;const old=recipes.find(r=>r.id===id);const item={id:id||crypto.randomUUID(),name:$('name').value.trim(),category:$('category').value,ingredients:$('ingredients').value.trim(),instructions:$('instructions').value.trim(),favorite:old?.favorite||false};if(!item.name||!item.ingredients||!item.instructions)return;if(old)Object.assign(old,item);else recipes.unshift(item);save();$('editor').close();render()};$('add').onclick=()=>openEditor();$('cancel').onclick=()=>$('editor').close();$('search').oninput=render;$('categoryFilter').onchange=render;$('favoritesFilter').onclick=()=>{onlyFavorites=!onlyFavorites;$('favoritesFilter').setAttribute('aria-pressed',String(onlyFavorites));$('favoritesFilter').textContent=onlyFavorites?'♥ Solo preferite':'♡ Preferite';render()};for(const cat of categories){const option=document.createElement('option');option.value=cat;option.textContent=cat;$('categoryFilter').append(option)}load();render();
if("serviceWorker" in navigator && location.protocol.startsWith("http")){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}))}
</script></body></html>
